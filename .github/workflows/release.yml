name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No se publica nada que no pase la verificación.
      - name: Verify before publishing
        run: |
          python3 tools/verify.py
          python3 tools/demo.py

      - name: Check the tag matches pyproject version
        run: |
          PYPROJECT=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PYPROJECT" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.meta.outputs.tag }} != pyproject version $PYPROJECT"
            exit 1
          fi

      - name: Build single-file zipapp
        run: python3 tools/build_pyz.py --out dist/ragorbit.pyz

      - name: Build sdist + wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      # Starter para el curso: el engine no lleva los templates dentro, y quien
      # sigue el curso los necesita junto a la UI del lienzo.
      - name: Build course starter zip
        run: |
          STAGE=$(mktemp -d)/ragorbit-course-starter
          mkdir -p "$STAGE"
          cp dist/ragorbit.pyz "$STAGE/"
          cp -r examples docs "$STAGE/"
          cp -r apps/web-lite "$STAGE/canvas"
          cp README.md RUNNING.md LICENSE "$STAGE/"
          cat > "$STAGE/EMPIEZA-AQUI.md" <<'EOF'
          # RAGorbit — starter del curso

          Todo lo necesario para seguir el curso, sin instalar nada.
          Requisito: Python 3.10 o superior.

              python3 ragorbit.pyz list-nodes                  # el catálogo: 53 nodos
              python3 ragorbit.pyz validate examples/*/flow.json
              python3 ragorbit.pyz generate examples/09-hr-policy-assistant/flow.json --out ./mi-bot
              cd mi-bot && python3 -m unittest discover -s tests

          El lienzo visual necesita el repo completo:
          https://github.com/slothlabsorg/ragorbit → `python3 -m ragorbit serve`

          El curso: https://slothlabs.org/rag-course
          EOF
          (cd "$(dirname "$STAGE")" && zip -qr ragorbit-course-starter.zip ragorbit-course-starter)
          cp "$(dirname "$STAGE")/ragorbit-course-starter.zip" dist/

      - name: List what will be published
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "RAGorbit ${{ steps.meta.outputs.version }}" \
            --generate-notes \
            dist/ragorbit.pyz \
            dist/ragorbit-course-starter.zip \
            dist/*.whl \
            dist/*.tar.gz \
          || gh release upload "${{ steps.meta.outputs.tag }}" \
            --repo "${{ github.repository }}" --clobber \
            dist/ragorbit.pyz \
            dist/ragorbit-course-starter.zip \
            dist/*.whl \
            dist/*.tar.gz

  homebrew:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      # El secret vive en este repo (no hay secrets de organización). Si falta, se
      # salta en lugar de fallar: el .pyz, el wheel y pipx ya se publicaron, y la
      # fórmula se puede rehacer con workflow_dispatch cuando el secret exista.
      - name: Check for HOMEBREW_TAP_TOKEN
        id: gate
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN no configurado; se omite la fórmula de Homebrew."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: dist
          path: dist

      - name: Render the formula
        if: steps.gate.outputs.ok == 'true'
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          TAG="${{ needs.build.outputs.tag }}"
          SHA=$(sha256sum dist/ragorbit.pyz | awk '{print $1}')
          mkdir -p out/Formula
          cat > out/Formula/ragorbit.rb <<EOF
          # Generado por el workflow de release de slothlabsorg/ragorbit.
          # Los cambios a mano se sobrescriben en el siguiente tag.
          class Ragorbit < Formula
            desc "Visual builder for RAG/agentic strategies that generates deployable Python"
            homepage "https://slothlabs.org/ragorbit"
            url "https://github.com/slothlabsorg/ragorbit/releases/download/$TAG/ragorbit.pyz"
            sha256 "$SHA"
            version "$VERSION"
            license "MIT"

            # El engine es stdlib puro: no necesita resolver dependencias, solo un
            # Python 3.10+ y el zipapp de un archivo.
            depends_on "python@3.12"

            def install
              libexec.install "ragorbit.pyz"
              (bin/"ragorbit").write <<~SH
                #!/bin/bash
                exec "#{Formula["python@3.12"].opt_bin}/python3.12" "#{libexec}/ragorbit.pyz" "\\$@"
              SH
              chmod 0755, bin/"ragorbit"
            end

            test do
              assert_match "tipos de nodo", shell_output("#{bin}/ragorbit list-nodes")
            end
          end
          EOF
          cat out/Formula/ragorbit.rb

      - name: Push to the tap
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: slothlabsorg/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the formula
        if: steps.gate.outputs.ok == 'true'
        run: |
          cp out/Formula/ragorbit.rb tap/Formula/ragorbit.rb
          cd tap
          git config user.name  "slothlabs-bot"
          git config user.email "bot@slothlabs.org"
          if git diff --quiet; then
            echo "La fórmula ya está al día."
            exit 0
          fi
          git add Formula/ragorbit.rb
          git commit -m "ragorbit ${{ needs.build.outputs.version }}"
          git push
