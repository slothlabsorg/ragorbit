# E2E del chat de aerolínea CON SERVICIOS CORRIENDO + KAFKA REAL.
#   docker compose up --build
# Levanta: Kafka (redpanda), los 5 servicios mock con sus contratos, y el bot
# que ejecuta el flujo de RAGorbit contra ellos publicando auditoría a Kafka.
services:
  kafka:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  services:
    build:
      context: ../..
      dockerfile: e2e/airline-chat/Dockerfile
    command: python e2e/airline-chat/services/mock_services.py 8900
    environment:
      - RAGORBIT_HOST=0.0.0.0
    ports:
      - "8900:8900"

  # Consumidor de auditoría: imprime los eventos del topic flight.audit (trazabilidad).
  audit-consumer:
    build:
      context: ../..
      dockerfile: e2e/airline-chat/Dockerfile
    command: python e2e/airline-chat/audit_consumer.py
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  bot:
    build:
      context: ../..
      dockerfile: e2e/airline-chat/Dockerfile
    command: python e2e/airline-chat/run_bot.py "Quiero cambiar mi vuelo SCL-BOG del 15 al 17"
    environment:
      - SERVICES_BASE=http://services:8900
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      services:
        condition: service_started
