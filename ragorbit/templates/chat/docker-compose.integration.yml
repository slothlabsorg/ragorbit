# Stack realista: servicios HTTP mock + Kafka + chat con integración.
#   docker compose up --build
#   open http://localhost:8888
services:
  kafka:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://kafka:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mock-services:
    build:
      context: .
      dockerfile: Dockerfile.services
    environment:
      - RAGORBIT_HOST=0.0.0.0
      - PORT=8080
    ports: ["8900:8080"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports: ["8888:8000"]
    env_file:
      - .env
    environment:
      - MOCK=false
      - INTEGRATION=true
      - USE_LLM=true
      - FLOW_ID={{FLOW_ID}}
      - SERVICES_BASE=http://mock-services:8080
      - KAFKA_BROKER=kafka:9092
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - LLM_MODEL=claude-sonnet-4-6
      - PORT=8000
    depends_on:
      mock-services:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Opcional (requiere kafka-python): docker compose --profile audit up
  audit-consumer:
    profiles: ["audit"]
    build: .
    command: python -m app.audit_consumer
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
